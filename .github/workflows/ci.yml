name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs; a tag can be moved, a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      - name: Install (exactly as locked)
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run pyright

      - name: Tests, with branch coverage
        run: uv run coverage run -m pytest

      # Reported, not gated (ADR 0022). Markdown table in the job summary.
      - name: Coverage report
        run: |
          uv run coverage report
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      # Known vulnerabilities in every locked dependency (OSV). uv audit is a
      # preview feature; the pinned uv version keeps its interface stable.
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      # Runtime dependencies only: dev tools aren't shipped (ADR 0022).
      - name: Install runtime dependencies and the checker
        run: uv sync --locked --no-dev --group licenses --exact

      - name: Check licences against the allow-list
        run: |
          allowed="$(grep -v -e '^#' -e '^$' licenses-allowed.txt | paste -sd ';')"
          uv run --no-sync pip-licenses --from=mixed --allow-only="$allowed"

