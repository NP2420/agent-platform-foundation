# Fast checks only. Pyright and tests run in CI and on demand.
# Local hooks call the Ruff pinned in uv.lock, so the hook and CI never disagree.
# Install once per clone: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
