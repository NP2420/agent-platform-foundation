[project]
name = "agent-platform"
version = "0.1.0"
description = "Self-hosted agent platform built to practise production-grade AI engineering."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.8,<0.14"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "C4",       # comprehensions
    "N",        # naming
    "PT",       # pytest style
    "S",        # bandit: security smells
    "T20",      # stray print()
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                                  # assert is how pytest works
"scripts/**" = ["T20", "S603", "S607"]                 # CLI output; fixed subprocess commands
"evals/**" = ["T20", "S603", "S607", "S310"]           # CLI output; subprocess; configured URL

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
